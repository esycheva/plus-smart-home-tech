server.port=8081

kafka.bootstrap-servers=localhost:9092

kafka.producer.client-id=aggregator-producer
kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.producer.value-serializer=ru.practicum.telemetry.TelemetryAvroSerializer

kafka.consumer.client-id=aggregator-consumer
kafka.consumer.group-id=aggregator.group
kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.consumer.value-deserializer=ru.practicum.telemetry.SensorEventDeserializer